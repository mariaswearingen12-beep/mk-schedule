<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run List</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#1b1b19;--mute:#6a6962;--line:#dcdad2;--accent:#1f5fbf;--accent-ink:#fff;--on:#17803d;--on-bg:#e3f4e8;--off:#b3411c;--off-bg:#fbe9e2;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#222220;--ink:#efeee9;--mute:#9b998f;--line:#393834;--accent:#6aa3f5;--accent-ink:#0d1b30;--on:#5fd48a;--on-bg:#16301f;--off:#ff9a73;--off-bg:#3a2119}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 14px 36px}
h1{font-size:20px;margin:0 0 2px}
p.sub{margin:0 0 14px;color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:10px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 16px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1}
#status{color:var(--mute);font-size:14px;margin-top:10px}
#status.err{color:#c0392b}
[hidden]{display:none!important}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.stat .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .s{font-size:13px;color:var(--mute)}
.job{grid-column:1/-1;border-bottom:1px solid var(--line);padding-bottom:10px}
.job .v{font-size:32px;letter-spacing:.03em}
.band{display:flex;justify-content:space-between;align-items:center;border-radius:10px;padding:9px 14px;font-weight:700;margin:12px 0}
.band .t{font-size:22px;font-variant-numeric:tabular-nums}
.band.on{background:var(--on-bg);color:var(--on)}
.band.off{background:var(--off-bg);color:var(--off)}
.train{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.tid{font-size:28px;font-weight:800;letter-spacing:.02em}
.route{font-size:22px;font-weight:700;text-align:right}
.times{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.times .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.times .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
  <h1>Today’s Run</h1>
  <p class="sub">Copy the text from the Job Schedule screen, paste it below, and tap the button.</p>
  <div class="card">
    <textarea id="src" placeholder="Paste the schedule screen text here" spellcheck="false"></textarea>
    <div class="row">
      <button class="primary" id="go">Generate Run List</button>
      <button id="paste">Paste</button>
      <button id="clear">Clear</button>
    </div>
    <div id="status"></div>
  </div>
  <div id="dash" hidden>
    <div class="card hero" id="hero"></div>
    <div id="list"></div>
    <div class="row">
      <button id="copy">Copy as text</button>
      <button id="save">Save .txt</button>
    </div>
  </div>
</main>
<script>
(function(){
  // Add or change station names here: CODE:'Name'
  var STATIONS={HB:'Hoboken',M1:'MSU',GL:'Gladstone',SU:'Summit',PO:'Port Jervis',H3:'Yard'};

  var $=function(i){return document.getElementById(i)};
  var data=null;
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function has(x){return x!=null&&String(x).trim()!==''}
  function clock(t){t=String(t||'');return t.length<4?'?':t.slice(0,2)+':'+t.slice(2,4)}
  function dur(t){t=String(t||'');return t.length<4?'\u2014':parseInt(t.slice(0,2),10)+'h '+t.slice(2,4)+'m'}
  function mins(t){return parseInt(t.slice(0,2),10)*60+parseInt(t.slice(2,4),10)}
  function plus(t,m){var x=(mins(t)+m)%1440;return('0'+Math.floor(x/60)).slice(-2)+('0'+x%60).slice(-2)}
  function stn(c){c=String(c||'').trim().toUpperCase();return c?(STATIONS[c]||c):'?'}
  function fmtJob(j){j=String(j||'').trim().toUpperCase();var m=j.match(/^O([A-Z]{2})[A-Z]?(\d+)/);return m?m[1]+' '+m[2]:(j||'\u2014')}
  function fmtTrain(t){t=String(t||'').trim();if(/^XF/i.test(t))return'Fuel Move';return t?t.replace(/^0+(?=\d)/,''):'?'}

  function parse(text){
    var up=text.toUpperCase(),jm=up.match(/\bJOB:\s*([A-Z0-9]+)/),tm=up.match(/TTOD\s*ASG:\s*(\d{4})/),trains=[],open=false;
    up.split(/\r?\n/).forEach(function(line){
      var m=line.match(/^\s*(\d{3})\s+([A-Z0-9]+)\s+(\d)\s+([A-Z0-9]{2})\s+([A-Z0-9]{2})\s+(\d+)\s+(\d+)\s+((?:\d{4}(?:\s+|$))+)/);
      if(!m)return;
      var t=m[8].trim().split(/\s+/),prep=parseInt(m[6],10),r={train:m[2],depStn:m[4],arrStn:m[5],on:null,off:null};
      if(t.length>=4){r.on=t[0];r.dep=t[1];r.arr=t[2];r.off=t[3]}
      else if(t.length===3){
        if(plus(t[0],prep)===t[1]||!open){r.on=t[0];r.dep=t[1];r.arr=t[2]}
        else{r.dep=t[0];r.arr=t[1];r.off=t[2]}
      }else if(t.length===2){r.dep=t[0];r.arr=t[1]}
      else return;
      if(r.on)open=true;
      if(r.off)open=false;
      trains.push(r);
    });
    return{job:jm?jm[1]:'',ttod:tm?tm[1]:'',trains:trains};
  }

  // Fuel moves: an odd XF followed by an even XF become one move.
  function mergeFuel(a){
    var out=[],i=0;
    while(i<a.length){
      var t=a[i],n=a[i+1],m1=t&&t.train.match(/^XF(\d+)$/),m2=n&&n.train.match(/^XF(\d+)$/);
      if(m1&&m2&&parseInt(m1[1],10)%2===1&&parseInt(m2[1],10)%2===0){
        out.push({train:'XF',depStn:t.depStn,arrStn:n.arrStn,dep:t.dep,arr:n.arr,on:has(t.on)?t.on:n.on,off:has(n.off)?n.off:t.off});i+=2;
      }else{out.push(t);i++}
    }
    return out;
  }

  function stat(k,v,s,cls){var d=el('div','stat '+(cls||''));d.appendChild(el('div','k',k));d.appendChild(el('div','v',v));if(s)d.appendChild(el('div','s',s));return d}
  function band(kind,label,time){var b=el('div','band '+kind);b.appendChild(el('span',null,label));b.appendChild(el('span','t',clock(time)));return b}

  function render(d){
    var hero=$('hero'),list=$('list');hero.textContent='';list.textContent='';
    var tr=mergeFuel(d.trains);
    hero.appendChild(stat('Job',fmtJob(d.job),'','job'));
    hero.appendChild(stat('Total time on duty',has(d.ttod)?dur(d.ttod):'\u2014',has(d.ttod)?'TTOD ASG '+d.ttod:''));
    var fo=tr.find(function(t){return has(t.on)}),lo=tr.slice().reverse().find(function(t){return has(t.off)});
    hero.appendChild(stat('Trains',String(tr.length),fo&&lo?'On '+clock(fo.on)+' \u2192 Off '+clock(lo.off):''));
    tr.forEach(function(t){
      if(has(t.on))list.appendChild(band('on','ON DUTY',t.on));
      var c=el('div','card train');
      c.appendChild(el('div','tid',fmtTrain(t.train)));
      c.appendChild(el('div','route',stn(t.depStn)+'  \u2192  '+stn(t.arrStn)));
      var tm=el('div','times'),a=el('div'),b=el('div');
      a.appendChild(el('div','k','Departs'));a.appendChild(el('div','v',clock(t.dep)));
      b.appendChild(el('div','k','Arrives'));b.appendChild(el('div','v',clock(t.arr)));
      tm.appendChild(a);tm.appendChild(b);c.appendChild(tm);list.appendChild(c);
      if(has(t.off))list.appendChild(band('off','OFF DUTY',t.off));
    });
  }

  function toText(d){
    var L=['JOB '+fmtJob(d.job),'TOTAL TIME ON DUTY: '+(has(d.ttod)?dur(d.ttod):'\u2014'),''];
    mergeFuel(d.trains).forEach(function(t){
      if(has(t.on))L.push('ON DUTY  '+clock(t.on));
      L.push(fmtTrain(t.train).padEnd(10)+' '+stn(t.depStn).padEnd(10)+' > '+stn(t.arrStn).padEnd(10)+'  dep '+clock(t.dep)+'  arr '+clock(t.arr));
      if(has(t.off))L.push('OFF DUTY '+clock(t.off));
    });
    return L.join('\n');
  }

  function status(m,err){var s=$('status');s.textContent=m||'';s.className=err?'err':''}

  $('go').addEventListener('click',function(){
    var txt=$('src').value;
    if(!txt.trim()){status('Paste the schedule text first.',true);return}
    data=parse(txt);
    if(!data.trains.length){$('dash').hidden=true;status('Couldn\u2019t find any train rows. Make sure you copied the whole schedule screen.',true);return}
    render(data);$('dash').hidden=false;status('');
    $('dash').scrollIntoView({behavior:'smooth',block:'start'});
  });
  $('paste').addEventListener('click',async function(){
    try{$('src').value=await navigator.clipboard.readText();status('')}
    catch(e){status('Couldn\u2019t paste automatically. Tap in the box and paste.',true)}
  });
  $('clear').addEventListener('click',function(){$('src').value='';$('dash').hidden=true;data=null;status('')});
  $('copy').addEventListener('click',async function(){
    if(!data)return;
    try{await navigator.clipboard.writeText(toText(data));status('Copied.')}catch(e){status('Couldn\u2019t copy automatically.',true)}
  });
  $('save').addEventListener('click',function(){
    if(!data)return;
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([toText(data)],{type:'text/plain'}));a.download='my-run.txt';a.click();
  });
})();
</script>
</body>
</html>
